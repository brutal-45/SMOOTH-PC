name: Update Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check Markdown files
        run: |
          echo "Checking repository structure..."
          ls -la
          echo "✅ Repository structure verified"
